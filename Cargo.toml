[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-email-dispatch",
    "crates/lenso-capability-notification-admin",
    "crates/lenso-capability-notification-delivery",
    "crates/lenso-capability-notification-transactional",
    "crates/lenso-notification-admin-agent-tools-plugin",
    "crates/notification",
]

[workspace.package]
edition = "2024"
homepage = "https://github.com/LioRael/lenso-notification-plugin"
license = "MIT"
repository = "https://github.com/LioRael/lenso-notification-plugin"
rust-version = "1.94"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
lenso = "0.5.0"
lenso-app-plan = "0.3.0"
lenso-capability-agent-tool-provider = "0.1.0"
lenso-capability-notification-template = "0.1.0"
lenso-capability-secrets = "0.1.1"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-native-adapter = "0.3.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
zeroize = "1.9"


[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
result_large_err = "allow"
too_many_lines = "allow"
