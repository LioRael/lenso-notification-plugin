name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      LENSO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notification_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: notification_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=notification_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check generated Capability freshness
        run: cargo check --locked --workspace
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check Console Surface and contracts
        run: pnpm check
      - name: Verify Plugin and Capability packages
        run: cargo package --locked --workspace
